name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run size-budget
      - run: npm run dup
      - run: npm run test:telemetry
      - run: npm run test:audit
      - run: npm run test:attachments
      - run: npm run test:auth
      - run: npm run test:desktop-tools
      - run: npm run test:provider-auth
      - run: npm run test:schema
      - run: npm run test:daemon-errors
      - run: npm run test:session-manager
      - run: npm run test:automations
      - run: npm run test:mcp-events
      - run: npm run test:guest-vms
      - run: npm run test:cross-package
      - run: npm run test:pr-sync
      - run: npm run test:routes
      - run: npm run test:feed
      - run: npm run test:automation-form
      - run: npm run test:session-settings
      - run: npm run build
      - run: npm run pack
      - name: Install the package outside the repo and run its CLI
        run: |
          set -eu
          version="$(node -p "require('./package.json').version")"
          tgz="$(ls "$GITHUB_WORKSPACE"/build/sessionboxer-*.tgz)"
          mkdir -p "$RUNNER_TEMP/pkg" && cd "$RUNNER_TEMP/pkg"
          npm init -y >/dev/null
          npm install --omit=dev "$tgz"
          test "$(./node_modules/.bin/sessionboxer version)" = "sessionboxer $version"
      - name: Control Plane image builds and compose file parses
        run: |
          docker build -f images/control-plane/Dockerfile -t sessionboxer/control-plane:ci build
          docker run --rm sessionboxer/control-plane:ci version
          docker compose -f docker-compose.yml config -q
      - name: Desktop app packages (unpacked, Linux only; release.yml does the installers)
        run: npm run dist -w @sessionboxer/desktop -- --linux --dir && test -x build/desktop/linux-unpacked/sessionboxer
