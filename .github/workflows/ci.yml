name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run pack
      - name: Install the package outside the repo and run its CLI
        run: |
          set -eu
          version="$(node -p "require('./package.json').version")"
          tgz="$(ls "$GITHUB_WORKSPACE"/build/sessionboxer-*.tgz)"
          mkdir -p "$RUNNER_TEMP/pkg" && cd "$RUNNER_TEMP/pkg"
          npm init -y >/dev/null
          npm install --omit=dev "$tgz"
          test "$(./node_modules/.bin/sessionboxer version)" = "sessionboxer $version"
      - name: Control Plane image builds and compose file parses
        run: |
          docker build -f images/control-plane/Dockerfile -t sessionboxer/control-plane:ci build
          docker run --rm sessionboxer/control-plane:ci version
          docker compose -f docker-compose.yml config -q
