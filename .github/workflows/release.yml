# Release on a version tag (`git tag v0.1.0 && git push origin v0.1.0`):
#   1. typecheck + build + assemble the npm package (build/sessionboxer-<version>.tgz)
#   2. Sandbox image        ghcr.io/talayolabs/sessionboxer-sandbox:<version>  (amd64 + arm64, native runners)
#   3. Control Plane image  ghcr.io/talayolabs/sessionboxer:<version>          (amd64 + arm64)
#   4. Desktop app installers (apps/desktop, electron-builder): Linux AppImage + deb (x64, arm64),
#      macOS dmg + zip (arm64, x64), Windows NSIS + zip (x64). Unsigned unless the signing secrets
#      below exist; then electron-builder signs (and notarizes on macOS) on its own.
#        macOS:   MAC_CSC_LINK (base64 .p12), MAC_CSC_KEY_PASSWORD,
#                 APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID (notarization)
#        Windows: WIN_CSC_LINK (base64 .pfx), WIN_CSC_KEY_PASSWORD
#   5. npm publish sessionboxer@<version>  — via npm trusted publishing (OIDC: this workflow is registered as the
#      package's trusted publisher on npmjs.com, no secret) or the NPM_TOKEN secret; fails without blocking the release
#   6. GitHub Release with the CHANGELOG section for the version, the tarball and the installers
# The tag must match package.json's version. Images are pushed by digest per architecture and
# joined into one manifest list afterwards; nothing is published if a build step fails.
name: Release

on:
  push:
    tags: ["v*"]

env:
  SANDBOX_IMAGE: ghcr.io/talayolabs/sessionboxer-sandbox
  CONTROL_PLANE_IMAGE: ghcr.io/talayolabs/sessionboxer

jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - name: Tag matches package.json
        id: version
        run: |
          set -eu
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run pack
      - name: Install the package outside the repo and run its CLI
        run: |
          set -eu
          tgz="$(ls "$GITHUB_WORKSPACE"/build/sessionboxer-*.tgz)"
          mkdir -p "$RUNNER_TEMP/pkg" && cd "$RUNNER_TEMP/pkg"
          npm init -y >/dev/null
          npm install --omit=dev "$tgz"
          test "$(./node_modules/.bin/sessionboxer version)" = "sessionboxer ${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: build/sessionboxer-*.tgz
          if-no-files-found: error
          retention-days: 7

  sandbox-image:
    needs: package
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Free disk space for a 5 GB image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: images/sandbox/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.package.outputs.version }}
            org.opencontainers.image.licenses=MIT
          outputs: type=image,name=${{ env.SANDBOX_IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sandbox-digest-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  control-plane-image:
    needs: package
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: npm-package
          path: build
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: build
          file: images/control-plane/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.package.outputs.version }}
            org.opencontainers.image.licenses=MIT
          outputs: type=image,name=${{ env.CONTROL_PLANE_IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: control-plane-digest-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifests:
    needs: [package, sandbox-image, control-plane-image]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: sandbox-digest-*
          path: ${{ runner.temp }}/sandbox
          merge-multiple: true
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: control-plane-digest-*
          path: ${{ runner.temp }}/control-plane
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the multi-arch manifest lists (<version> and latest)
        run: |
          set -eu
          version="${{ needs.package.outputs.version }}"
          tag_manifest() {
            image="$1"; dir="$2"; set --
            for digest in "$dir"/*; do set -- "$@" "$image@sha256:$(basename "$digest")"; done
            [ $# -eq 2 ] || { echo "expected 2 digests for $image, got $#" >&2; exit 1; }
            docker buildx imagetools create -t "$image:$version" -t "$image:latest" "$@"
            docker buildx imagetools inspect "$image:$version"
          }
          tag_manifest "$SANDBOX_IMAGE" "$RUNNER_TEMP/sandbox"
          tag_manifest "$CONTROL_PLANE_IMAGE" "$RUNNER_TEMP/control-plane"

  desktop:
    needs: package
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            args: --linux
          - runner: ubuntu-24.04-arm
            args: --linux
          - runner: macos-15
            args: --mac --arm64 --x64
          - runner: windows-2025
            args: --win
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Code-signing secrets, only when set (an empty CSC_LINK makes electron-builder fail)
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          set -eu
          pass() { if [ -n "${!1:-}" ]; then echo "$2=${!1}" >> "$GITHUB_ENV"; fi; }
          case "$RUNNER_OS" in
            macOS)
              pass MAC_CSC_LINK CSC_LINK; pass MAC_CSC_KEY_PASSWORD CSC_KEY_PASSWORD
              pass APPLE_ID APPLE_ID; pass APPLE_APP_SPECIFIC_PASSWORD APPLE_APP_SPECIFIC_PASSWORD; pass APPLE_TEAM_ID APPLE_TEAM_ID
              [ -n "$MAC_CSC_LINK" ] || echo "::notice::MAC_CSC_LINK is not set; the macOS app is unsigned" ;;
            Windows)
              pass WIN_CSC_LINK WIN_CSC_LINK; pass WIN_CSC_KEY_PASSWORD WIN_CSC_KEY_PASSWORD
              [ -n "$WIN_CSC_LINK" ] || echo "::notice::WIN_CSC_LINK is not set; the Windows installer is unsigned" ;;
          esac
      - name: Package with electron-builder
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist -w @sessionboxer/desktop -- ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.runner }}
          path: |
            build/desktop/*.AppImage
            build/desktop/*.deb
            build/desktop/*.dmg
            build/desktop/*.zip
            build/desktop/*.exe
          if-no-files-found: error
          retention-days: 7

  npm-publish:
    needs: [package, manifests]
    runs-on: ubuntu-24.04
    # Fails (visibly) when neither the trusted publisher nor the NPM_TOKEN secret is set up; the GitHub Release
    # is still cut and its notes then point at the tarball instead of `npx sessionboxer@<version>`.
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: npm-package
          path: build
      - name: npm publish (trusted publisher, or the NPM_TOKEN secret)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -eu
          npm install -g npm@latest   # trusted publishing needs npm 11.5.1+; Node 22 ships an older one
          if npm publish ./build/sessionboxer-*.tgz --access public --provenance; then exit 0; fi
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error title=sessionboxer@$VERSION was not published to npm::no npm credentials. On npmjs.com → sessionboxer → Settings → Trusted Publisher add GitHub Actions with repository talayolabs/sessionboxer and workflow release.yml (allow npm publish); or set the NPM_TOKEN repository secret. Then re-run this job, or publish by hand: npm publish ./build/sessionboxer-$VERSION.tgz --access public"
          fi
          exit 1
      - name: Verify the package is on the registry
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -eu
          # npm processes provenance publishes asynchronously; the version can take several minutes to appear.
          for i in $(seq 1 40); do
            if [ "$(npm view "sessionboxer@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "sessionboxer@$VERSION is on the npm registry"; exit 0
            fi
            sleep 15
          done
          echo "::error::npm view sessionboxer@$VERSION does not return the version 10 minutes after publishing"; exit 1

  github-release:
    needs: [package, manifests, desktop, npm-publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: npm-package
          path: build
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: desktop-*
          path: build/desktop
          merge-multiple: true
      - name: Checksums of the installers
        run: |
          set -eu
          cd build/desktop && ls -l && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          set -eu
          version="${{ needs.package.outputs.version }}"
          awk -v v="$version" '
            /^## / { if (found) exit; found = index($0, "## " v) == 1; next }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "CHANGELOG.md has no '## $version' section" >&2; exit 1
          fi
          tarball="https://github.com/${{ github.repository }}/releases/download/v$version/sessionboxer-$version.tgz"
          if [ "$(npm view "sessionboxer@$version" version 2>/dev/null)" = "$version" ]; then
            npm_line="npm: \`npx sessionboxer@$version serve\`, or \`npm i -g sessionboxer@$version\` then \`sessionboxer serve\`."
          else
            npm_line="npm: this version is not on the npm registry; install the tarball below instead: \`npm i -g $tarball\` then \`sessionboxer serve\` (Node 22+ and Docker)."
          fi
          {
            cat "$RUNNER_TEMP/notes.md"
            echo
            echo "Images: \`$SANDBOX_IMAGE:$version\`, \`$CONTROL_PLANE_IMAGE:$version\` (linux/amd64, linux/arm64)."
            echo "$npm_line Full instructions: https://github.com/${{ github.repository }}#install"
            echo
            echo "Desktop app (needs Docker, not Node): the \`Sessionboxer-$version-*\` files below — Linux AppImage/deb (x64, arm64), macOS dmg/zip (\`mac-arm64\` for Apple silicon, \`mac-x64\` for Intel), Windows installer/zip (x64); \`SHA256SUMS\` alongside."
            echo
            echo "The builds are not code-signed yet, so macOS says the dmg *is damaged and can't be opened*. Before opening it, clear the quarantine flag on the download: \`xattr -d com.apple.quarantine ~/Downloads/Sessionboxer-$version-mac-*.dmg\`, then open the dmg and drag Sessionboxer to Applications. If the app itself is still refused, \`xattr -dr com.apple.quarantine /Applications/Sessionboxer.app\` or right-click → Open. On Windows choose *More info → Run anyway* in SmartScreen."
          } > "$RUNNER_TEMP/release.md"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/sessionboxer-*.tgz build/desktop/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Sessionboxer ${{ needs.package.outputs.version }}" \
            --notes-file "$RUNNER_TEMP/release.md" \
            --verify-tag
